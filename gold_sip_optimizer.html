<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-gray-800">Fund Performance</h1>
        
        <!-- NAV & Fund Size -->
        <div class="mt-4">
            <p class="text-lg font-semibold">Current NAV: <span id="currentNav" class="text-green-600">Loading...</span></p>
            <p class="text-lg font-semibold">Fund Size: <span class="text-blue-600">₹2,500 Cr</span></p>
        </div>
        
        <!-- Timeframe Selection -->
        <div class="mt-4">
            <select id="timeframe" class="p-2 border rounded-lg">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
            </select>
        </div>
        
        <!-- Graph -->
        <canvas id="navChart" class="mt-4"></canvas>
        
        <!-- Investment Button -->
        <button class="mt-6 bg-blue-500 text-white px-6 py-2 rounded-lg text-lg font-semibold hover:bg-blue-600">Invest Now</button>
    </div>

    <script>
        const ctx = document.getElementById('navChart').getContext('2d');
        let chart;
        let navData = [];
        let labels = [];

        async function loadCSV() {
            const response = await fetch('Report_Latest_NAV.csv'); // Ensure this file is accessible on your server
            const data = await response.text();
            const rows = data.split('\n').slice(1); // Remove header row
            
            navData = [];
            labels = [];
            
            rows.forEach(row => {
                const cols = row.split(',');
                labels.push(cols[0]); // Date column
                navData.push(parseFloat(cols[1])); // NAV column
            });
            
            document.getElementById('currentNav').textContent = `₹${navData[navData.length - 1]}`;
            createChart('day');
        }

        function createChart(timeframe) {
            if (chart) chart.destroy();
            let displayData, displayLabels;

            switch (timeframe) {
                case 'day':
                    displayData = navData.slice(-7);
                    displayLabels = labels.slice(-7);
                    break;
                case 'week':
                    displayData = navData.slice(-30);
                    displayLabels = labels.slice(-30);
                    break;
                case 'month':
                    displayData = navData.slice(-90);
                    displayLabels = labels.slice(-90);
                    break;
                case 'year':
                    displayData = navData;
                    displayLabels = labels;
                    break;
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: displayLabels,
                    datasets: [{
                        label: 'NAV (₹)',
                        data: displayData,
                        borderColor: 'rgb(75, 192, 192)',
                        borderWidth: 2,
                        fill: false,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        document.getElementById('timeframe').addEventListener('change', function() {
            createChart(this.value);
        });

        loadCSV();
    </script>
</body>
</html>
